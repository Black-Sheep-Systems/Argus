[package]
name = "argus-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
argus-core = { path = "../core" }
napi = { version = "3", default-features = false, features = ["napi6", "async"] }
napi-derive = "3"
tokio = { version = "1", features = ["sync"] }
zeroize = "1"
anyhow = "1"
serde_json = "1"
serde = "1"
getrandom = "0.3"

[build-dependencies]
napi-build = "2"
